# Smoke preset: two SFT steps of SenseNova-Loop-9B on a small rustdoc corpus.
# The 9B weights stay in bf16; only the last linear-attention layer and the last full-attention layer
# train (split master). The example is a pipeline check, not a documentation run.
run:
  name: smoke_sft_sensenova
  seed: 0
  out_dir: runs
  checkpoint_every: 100
  release_cache: true
method: sft
model:
  path: models/SenseNova-Loop-9B
  dtype: bfloat16
  trust_remote_code: true
  attn_implementation: sdpa
  gradient_checkpointing: true
  compile_kernels: false
  trainable: [language]
  language_layers: ["30-31"]
sft:
  corpus: datasets/rust-docs/rust-cargo-uuid-docs-0001
  max_tokens: 512
  rows_per_step: 1
  eval_tasks: false
  fused_loss: true
optim:
  lr: 2.0e-5
  optimizer: adafactor
  master_weights: true
  max_grad_norm: 1.0
  steps: 2
  schedule: constant
  warmup_steps: 0
  master_storage: split
eval:
  every: 2
  split: test
  limit: 2
  batch_mode: auto
