# Preset variant of rust_std_io_jolt.yaml: 128 rollout rows (B=16, G=4), idea U8 (docs/07-usage.md §7.12).
# 176 tasks in train: B=16 gives 11 steps per epoch, 22 steps ≈ 2 epochs (same as 44 steps at B=8); lr is the same because the loss is normalized by N.
# Evaluate every 10 steps, at the same epoch points as every: 20 in the base. The recipe differs: B is not the paper's value.
run:
  name: rust_std_io_lfm3_jolt_b16
  seed: 0
  out_dir: runs
  checkpoint_every: 5
  release_cache: true      # return allocator cache at phase boundaries: VRAM reserve 20.3 → 17.5 GB (+1% step time)
  pinned_checkpoint: true  # checkpoint snapshot via pinned RAM: main thread stalls ~0.05 s instead of 1–3 s
method: jolt
model:
  path: models/LFM3-1.7B
  dtype: bfloat16
  trust_remote_code: true
  attn_implementation: sdpa
  gradient_checkpointing: true
  compile_kernels: true
task:
  dataset: datasets/rust/rust-std-module-io-0001
  privileged: reference_answer
rollout:
  group_size: 4
  batch_size: 16
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  repetition_penalty: 1.0
  engine: static
  micro_batch_tokens: 4096
  max_new_tokens: 768
  micro_batch_size: 16
  generation_batch_size: 128  # 2·B·G = 128 rows for both roles: one generation call per step
optim:
  lr: 1.0e-6
  beta_teacher_kl: 0.03
  beta_student_distill: 0.1
  optimizer: adafactor
  master_weights: true
  max_grad_norm: 1.0
  epochs: 5
  schedule: constant
  warmup_steps: 2
  master_storage: split    # master = bf16 weights + int16 low halves: bit-identical to the fp32 master, peak VRAM −3.2 GB
eval:
  every: 10
  split: test
  limit: 88
  max_new_tokens: 768
  batch_mode: auto  # eval.batch_size = min(test size, eval.limit, 128), set when the config is loaded
