# Smoke preset: two SFT steps of Gemma 4 E4B on a small rustdoc corpus.
# Only the last two decoder layers train (split master). The embeddings, including the per-layer table, stay frozen.
# The example is a pipeline check, not a documentation run. bf16 weights are about 15 GB.
run:
  name: smoke_sft_gemma4_e4b
  seed: 0
  out_dir: runs
  checkpoint_every: 100
  release_cache: true
method: sft
model:
  path: models/Gemma-4-E4B-it
  dtype: bfloat16
  trust_remote_code: false
  attn_implementation: sdpa
  gradient_checkpointing: true
  compile_kernels: false
  trainable: [language]
  language_layers: ["40-41"]
sft:
  corpus: datasets/rust-docs/rust-cargo-uuid-docs-0001
  max_tokens: 512
  rows_per_step: 1
  eval_tasks: false
  fused_loss: false
optim:
  lr: 2.0e-5
  optimizer: adafactor
  master_weights: true
  max_grad_norm: 1.0
  steps: 2
  schedule: constant
  warmup_steps: 0
  master_storage: split
eval:
  every: 2
  split: test
  limit: 2
  batch_mode: auto
