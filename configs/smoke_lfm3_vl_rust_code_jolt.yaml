# Smoke preset for LFM3-VL-2B (architecture Lfm3VlForConditionalGeneration, docs/12-vision.md) on the image set
# datasets/rust-vision/rust-code-output-0001: the Rust program is only in the image, so the vision tower and the
# projector receive the gradient together with the language model (model.trainable — all groups).
# Differences from a full run: 3 steps, B=2, G=2, max_new_tokens=256, eval.limit=8, eval.every=3.
run:
  name: smoke_lfm3_vl_rust_code_jolt
  seed: 0
  out_dir: runs
  checkpoint_every: 3
  release_cache: true
  pinned_checkpoint: true  # checkpoint snapshot via pinned RAM: main thread stalls ~0.05 s instead of 1–3 s
method: jolt
model:
  path: models/LFM3-VL-2B
  dtype: bfloat16
  trust_remote_code: true
  attn_implementation: sdpa
  gradient_checkpointing: true
  compile_kernels: true
  trainable: [language, vision, projector]
  image_min_tokens: 64
  image_max_tokens: 256    # one token — 32×32 pixels; the set's images take ≈100–200 tokens
task:
  dataset: datasets/rust-vision/rust-code-output-0001
  privileged: reference_answer
rollout:
  group_size: 2
  batch_size: 2
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  repetition_penalty: 1.0
  engine: static
  micro_batch_tokens: 4096
  max_new_tokens: 256
  micro_batch_size: 2
  generation_batch_size: 64
optim:
  lr: 1.0e-6
  vision_lr_scale: 1.0
  projector_lr_scale: 1.0
  beta_teacher_kl: 0.03
  beta_student_distill: 0.1
  optimizer: adafactor
  master_weights: true
  max_grad_norm: 1.0
  steps: 3
  schedule: constant
  warmup_steps: 1
  master_storage: split    # master = bf16 weights + int16 low halves: bit-identical to the fp32 master
eval:
  every: 3
  split: test
  limit: 8
  max_new_tokens: 256
  batch_mode: auto  # eval.batch_size = min(test size, eval.limit, 128), set when the config is loaded
