# Smoke preset: the Russian speech stage of LFM3-Omni-2B (sft_lfm3_omni_fleurs_ru.yaml) on a small FLEURS ru corpus.
#   python scripts/build_fleurs_speech_corpus.py --out data/fleurs-ru-speech-smoke --limit 32
# 32 recordings per split (64 + 64 documents), 3 steps of 2 rows, evaluation (speech loss, TTS round trip, ASR) on 4.
run:
  name: smoke_sft_lfm3_omni_fleurs_ru
  seed: 0
  out_dir: runs
  checkpoint_every: 3
  release_cache: true
  pinned_checkpoint: true
method: sft
model:
  path: models/LFM3-Omni-2B
  dtype: bfloat16
  trust_remote_code: true
  attn_implementation: sdpa
  gradient_checkpointing: true
  compile_kernels: true
  trainable: [language, audio, voice]
sft:
  corpus: data/fleurs-ru-speech-smoke
  max_tokens: 4096
  rows_per_step: 2
  eval_tasks: false
optim:
  lr: 1.0e-5
  voice_lr_scale: 2.0
  optimizer: adafactor
  master_weights: true
  max_grad_norm: 1.0
  steps: 3
  schedule: constant
  warmup_steps: 1
  master_storage: split
eval:
  every: 3
  split: test
  limit: 4
  max_new_tokens: 256
  batch_mode: auto
