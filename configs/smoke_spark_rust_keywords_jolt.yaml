# Smoke preset for Spark-X2.6-1.7B (architecture Spark2_5ForCausalLM): smoke_rust_keywords_jolt.yaml on another model.
# Differences from the full run: 3 steps, B=2, G=2, max_new_tokens=128, eval.limit=8, eval.every=3.
run:
  name: smoke_spark_rust_keywords_jolt
  seed: 0
  out_dir: runs
  checkpoint_every: 3
  release_cache: true
  pinned_checkpoint: true  # checkpoint snapshot via pinned RAM: main thread stalls ~0.05 s instead of 1–3 s
method: jolt
model:
  path: models/Spark-X2.6-1.7B
  dtype: bfloat16
  trust_remote_code: false  # Spark2_5 is built by the pipeline's own implementation (trener/architectures/spark2_5.py)
  attn_implementation: sdpa
  gradient_checkpointing: true
  compile_kernels: true
task:
  dataset: datasets/rust/rust-keywords-0001
  privileged: reference_answer
rollout:
  group_size: 2
  batch_size: 2
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  repetition_penalty: 1.0
  engine: static
  micro_batch_tokens: 4096
  max_new_tokens: 128
  micro_batch_size: 2
  generation_batch_size: 64
optim:
  lr: 1.0e-6
  beta_teacher_kl: 0.03
  beta_student_distill: 0.1
  optimizer: adafactor
  master_weights: true
  max_grad_norm: 1.0
  steps: 3
  schedule: constant
  warmup_steps: 1
  master_storage: split    # master = bf16 weights + int16 low halves: bit-identical to the fp32 master, peak VRAM −3.2 GB
eval:
  every: 3
  split: test
  limit: 8
  max_new_tokens: 128
  batch_mode: auto  # eval.batch_size = min(test size, eval.limit, 128), set when the config is loaded
