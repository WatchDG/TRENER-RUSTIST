# Smoke preset: the sft stage of LFM3-VL-2B on a corpus with images (docs/08-sft.md, docs/12-vision.md).
# Corpus: the qa records of datasets/rust-vision/rust-code-output-0001 (corpus.json in the same directory; built by
# scripts/make_rust_code_images_0001.py): the question about the image, the computation and the boxed answer.
# The vision tower and the projector train with the language model; 3 steps of 4 rows.
run:
  name: smoke_sft_lfm3_vl
  seed: 0
  out_dir: runs
  checkpoint_every: 3
  release_cache: true
  pinned_checkpoint: true
method: sft
model:
  path: models/LFM3-VL-2B
  dtype: bfloat16
  trust_remote_code: true
  attn_implementation: sdpa
  gradient_checkpointing: true
  compile_kernels: true
  trainable: [language, vision, projector]
  image_min_tokens: 64
  image_max_tokens: 256
sft:
  corpus: datasets/rust-vision/rust-code-output-0001
  max_tokens: 2048
  rows_per_step: 4
  eval_tasks: false
optim:
  lr: 2.0e-5
  vision_lr_scale: 0.5     # the vision tower is pretrained on far more images than this corpus has
  projector_lr_scale: 1.0
  optimizer: adafactor
  master_weights: true
  max_grad_norm: 1.0
  steps: 3
  schedule: constant
  warmup_steps: 1
  master_storage: split
eval:
  every: 3                 # NLL on the test split of the corpus
  split: test
  limit: 40
  max_new_tokens: 256
  batch_mode: auto
