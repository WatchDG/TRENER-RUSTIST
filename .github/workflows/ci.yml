name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: Lint
        run: python -m ruff check .

  test:
    # The pipeline targets Windows (docs/07-usage.md); CI runs the CPU part of the suite there.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        # PyPI wheels of torch for Windows are CPU builds: drop the CUDA local version from the pin.
        run: |
          python -m pip install --upgrade pip
          sed -E 's/^(torch==[^+]+)\+cu[0-9]+/\1/' requirements.txt > requirements-ci.txt
          python -m pip install -r requirements-ci.txt -r requirements-dev.txt
      - name: Fetch LFM3 tokenizer and config (no weights)
        run: >
          python -c "from huggingface_hub import snapshot_download;
          snapshot_download('LiquidAI/LFM3-1.7B', local_dir='models/LFM3-1.7B',
          allow_patterns=['*.json', '*.py', '*.jinja'])"
      - name: Test
        run: python -m pytest -q -m "not slow"
